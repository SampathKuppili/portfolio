{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">404</div>
        <h1 class="text-2xl font-bold mt-4 mb-2" style="color: var(--text-primary);">Page Not Found</h1>
        <p class="mb-6" style="color: var(--text-secondary);">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{% url 'portfolio:home' %}" class="btn btn-primary">
            <i class="fa-solid fa-home"></i> Go Home
        </a>
    </div>
</div>
{% endblock %}
