{% extends "base.html" %}

{% block title %}403 — Forbidden{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">403</div>
        <h1 class="text-2xl font-bold mt-4 mb-2" style="color: var(--text-primary);">Access Denied</h1>
        <p class="mb-6" style="color: var(--text-secondary);">You don't have permission to access this page.</p>
        <a href="{% url 'portfolio:home' %}" class="btn btn-primary">
            <i class="fa-solid fa-home"></i> Go Home
        </a>
    </div>
</div>
{% endblock %}
